<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElectroMart - Demo E-Commerce Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin-bottom:10px;
}

.notice{
    background:#fff3cd;
    color:#856404;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.container{
    width:90%;
    margin:auto;
    padding:30px 0;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.product:hover{
    transform:translateY(-5px);
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{
    padding:15px;
    text-align:center;
}

.product h3{
    margin-bottom:10px;
}

.price{
    color:#28a745;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

footer{
    background:#212529;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>

</head>
<body>

<header>
    <h1>ElectroMart</h1
